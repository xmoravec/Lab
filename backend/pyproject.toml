[tool.mypy]
python_version = "3.13"
files = ["app"]
strict = true
warn_unreachable = true
show_error_codes = true
pretty = true

[[tool.mypy.overrides]]
module = [
  "motor",
  "motor.*",
]
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = [
  "importlib.metadata",
]
ignore_missing_imports = false

[[tool.mypy.overrides]]
module = [
  "wordfreq",
  "wordfreq.*",
]
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = [
  "bcrypt",
  "bcrypt.*",
]
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = [
  "chess",
  "chess.*",
]
ignore_missing_imports = true

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
addopts = "-ra -vv --strict-markers"
asyncio_mode = "auto"
log_cli = true
log_cli_level = "INFO"
markers = [
  "core: core infra/security tests",
  "games: gameplay module tests",
  "tools: tools module tests",
  "integration: integration tests with external systems",
  "smoke: lightweight smoke tests",
]
