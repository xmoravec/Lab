services:
  mongo:
    image: mongo:8
    container_name: lab-mongo
    restart: unless-stopped
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 10s
      timeout: 5s
      retries: 8
      start_period: 20s

  backend:
    build:
      context: ../backend
      dockerfile: ../docker/backend.Dockerfile
      target: production
    container_name: lab-backend
    restart: unless-stopped
    environment:
      APP_ENV: ${APP_ENV:-production}
      PORT: ${PORT:-8000}
      MONGO_URI: ${MONGO_URI:-mongodb://mongo:27017/lab}
      MONGO_DB_NAME: ${MONGO_DB_NAME:-lab}
      MONGO_MAX_POOL_SIZE: ${MONGO_MAX_POOL_SIZE:-10}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:3000,http://127.0.0.1:3000}
      ENABLE_GZIP: ${ENABLE_GZIP:-true}
      GZIP_MINIMUM_SIZE_BYTES: ${GZIP_MINIMUM_SIZE_BYTES:-500}
      GZIP_COMPRESS_LEVEL: ${GZIP_COMPRESS_LEVEL:-5}
      FRONTEND_PROBE_URL: ${FRONTEND_PROBE_URL:-http://frontend:3000}
      FRONTEND_PROBE_TIMEOUT_SECONDS: ${FRONTEND_PROBE_TIMEOUT_SECONDS:-1.5}
      INTERNAL_AUTH_SECRET: ${INTERNAL_AUTH_SECRET:?INTERNAL_AUTH_SECRET must be set}
    ports:
      - "${API_PORT:-8000}:8000"
    depends_on:
      mongo:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/health', timeout=2)"]
      interval: 10s
      timeout: 5s
      retries: 8
      start_period: 20s

  frontend:
    build:
      context: ../frontend
      dockerfile: ../docker/frontend.Dockerfile
      target: production
    container_name: lab-frontend
    restart: unless-stopped
    environment:
      NODE_ENV: production
      NEXT_PUBLIC_API_BASE_URL: ${NEXT_PUBLIC_API_BASE_URL:-http://localhost:8000}
      API_INTERNAL_BASE_URL: ${API_INTERNAL_BASE_URL:-http://backend:8000}
      BACKEND_INTERNAL_AUTH_SECRET: ${INTERNAL_AUTH_SECRET:?INTERNAL_AUTH_SECRET must be set}
      AUTH_SECRET: ${AUTH_SECRET:?AUTH_SECRET must be set}
      AUTH_GOOGLE_ID: ${AUTH_GOOGLE_ID:-}
      AUTH_GOOGLE_SECRET: ${AUTH_GOOGLE_SECRET:-}
    ports:
      - "${WEB_PORT:-3000}:3000"
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:3000').then((res)=>process.exit(res.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 8
      start_period: 20s

volumes:
  mongo_data:
