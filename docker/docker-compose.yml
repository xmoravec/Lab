services:
  mongo:
    image: mongo:8
    container_name: lab-mongo
    restart: unless-stopped
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db

  backend:
    build:
      context: ../backend
      dockerfile: ../docker/backend.Dockerfile
    container_name: lab-backend
    restart: unless-stopped
    environment:
      MONGO_URI: ${MONGO_URI:-mongodb://mongo:27017/lab}
      MONGO_DB_NAME: ${MONGO_DB_NAME:-lab}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:3000,http://127.0.0.1:3000}
      FRONTEND_PROBE_URL: ${FRONTEND_PROBE_URL:-http://frontend:3000}
      FRONTEND_PROBE_TIMEOUT_SECONDS: ${FRONTEND_PROBE_TIMEOUT_SECONDS:-1.5}
    volumes:
      - ../backend:/app
    ports:
      - "${API_PORT:-8000}:8000"
    depends_on:
      - mongo

  frontend:
    build:
      context: ../frontend
      dockerfile: ../docker/frontend.Dockerfile
    container_name: lab-frontend
    restart: unless-stopped
    environment:
      NEXT_PUBLIC_API_BASE_URL: ${NEXT_PUBLIC_API_BASE_URL:-http://localhost:8000}
      WATCHPACK_POLLING: "true"
      CHOKIDAR_USEPOLLING: "true"
    volumes:
      - ../frontend:/app
      - frontend_node_modules:/app/node_modules
      - frontend_next:/app/.next
    ports:
      - "${WEB_PORT:-3000}:3000"
    depends_on:
      - backend

volumes:
  mongo_data:
  frontend_node_modules:
  frontend_next:
