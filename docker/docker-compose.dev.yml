services:
  backend:
    build:
      target: development
    environment:
      APP_ENV: development
      INTERNAL_AUTH_SECRET: ${INTERNAL_AUTH_SECRET:-lab-internal-dev-secret}
    volumes:
      - ../backend:/app

  frontend:
    build:
      target: development
    environment:
      NODE_ENV: development
      BACKEND_INTERNAL_AUTH_SECRET: ${INTERNAL_AUTH_SECRET:-lab-internal-dev-secret}
      AUTH_SECRET: ${AUTH_SECRET:-replace-with-long-random-secret}
      WATCHPACK_POLLING: "true"
      CHOKIDAR_USEPOLLING: "true"
    volumes:
      - ../frontend:/app
      - frontend_node_modules:/app/node_modules
      - frontend_next:/app/.next

volumes:
  frontend_node_modules:
  frontend_next:
